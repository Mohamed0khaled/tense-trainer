<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      var pathSegmentsToKeep = 1
      var location = window.location
      location.replace(
        location.protocol +
          '//' +
          location.hostname +
          (location.port ? ':' + location.port : '') +
          location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          location.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/') +
          location.search.replace(/&/g, '~and~') +
          location.hash,
      )
    </script>
  </head>
  <body></body>
</html>
